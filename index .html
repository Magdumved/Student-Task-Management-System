<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Highlighting System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">✨</div>

            <h1>Smart Highlighting</h1>
            <p class="tagline">Highlight what matters. Understand better.</p>

            <form id="loginForm">

                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password"
                    required
                >

                <div class="options">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>

            </form>

            <p class="signup">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
